<!doctype html><html><head><meta charset="utf8">
<script src="geomdata.js"></script>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fff; --panelBorder:#e3ddd0; --ink:#2b2b2b; --muted:#8a8577;
    --accent:#3b6ea5; --accentInk:#fff; --headFont:system-ui; --bodyFont:system-ui;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--bodyFont);
       display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  .stage{position:relative;width:1500px;height:1120px}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--panelBorder);
         border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
  .rack{width:150px;padding:14px}
  .rack h3{margin:0 0 10px;font-family:var(--headFont);font-size:15px;font-weight:600;
           letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
  .tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      font-weight:700;font-size:15px}
  .pc.w{background:radial-gradient(circle at 35% 28%, #fff, #e9e6df);color:#2b2b2b;
        box-shadow:inset 0 -2px 4px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.2)}
  .pc.b{background:radial-gradient(circle at 35% 28%, #5a5a5a, #1c1c1c);color:#fff;
        box-shadow:inset 0 -2px 4px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.3)}
  .pc.empty{background:transparent;border:2px dashed var(--panelBorder);box-shadow:none}
  .tray.saved{background:rgba(0,0,0,.03);border-radius:10px;padding:8px;min-height:52px;margin-top:10px}
  .lbl{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  #leftTop{left:20px;top:120px}   #leftBot{left:20px;top:470px}
  #rightTop{right:20px;top:120px} #rightBot{right:20px;top:470px}
  .topbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);
          display:flex;gap:16px;align-items:center}
  .btn{font-family:var(--headFont);font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;
       background:var(--accent);color:var(--accentInk);border:none;box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--panelBorder);box-shadow:none}
  .dice{display:flex;gap:10px}
  .die{width:46px;height:46px;border-radius:10px;background:var(--panel);border:1px solid var(--panelBorder);
       box-shadow:0 3px 8px rgba(0,0,0,.12);position:relative}
  .die.active{outline:2px solid var(--accent);outline-offset:2px}
  .pip{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);
       transform:translate(-50%,-50%)}
  .status{position:absolute;left:20px;bottom:16px;font-size:14px;color:var(--muted);line-height:1.7}
  .status b{color:var(--ink)}
  .turn{position:absolute;right:20px;bottom:16px;display:flex;align-items:center;gap:10px;
        font-family:var(--headFont);font-weight:600}
  .turn .dot{width:16px;height:16px;border-radius:50%;background:#2b2b2b;box-shadow:0 2px 4px rgba(0,0,0,.3)}
  .title{position:absolute;left:20px;top:24px;font-family:var(--headFont);font-weight:700;font-size:20px;letter-spacing:-.01em}
</style></head>
<body>
<div class="stage">
  <canvas id="c" width="1160" height="1080"></canvas>
  <div class="title" id="title">HUB &amp; SPOKE</div>
  <div class="topbar">
    <div class="dice"><div class="die active" id="d1"></div><div class="die" id="d2"></div></div>
    <button class="btn">New Game</button>
    <button class="btn ghost">How to Play</button>
  </div>
  <div class="panel rack" id="leftTop"><h3>You · rack</h3><div class="tray" id="wrack"></div>
     <div class="lbl">Saved</div><div class="tray saved" id="wsaved"></div></div>
  <div class="panel rack" id="rightTop"><h3>AI · rack</h3><div class="tray" id="brack"></div>
     <div class="lbl">Saved</div><div class="tray saved" id="bsaved"></div></div>
  <div class="status">Games <b>3</b> · Wins <b>2</b> · Losses <b>1</b> · Draws <b>0</b></div>
  <div class="turn"><span class="dot"></span> AI to move</div>
</div>

<script>
// ---------- themes ----------
const THEMES = {
 A:{ // Clean Modern
   name:'Clean Modern', page:'#eef1f4', canvasBg:'#eef1f4',
   field:'#ffffff', field2:'#eef1f6', nogo:'#8b97a8', home:'#ffd24d', homeRing:'#e9b21e',
   save:['#e8f0fb'], saveInk:'#3b6ea5', goalColors:{1:'#e15b64',2:'#f0a04b',3:'#f7d154',4:'#66b26a',5:'#4a90d9',6:'#9b6dc9'},
   stroke:'#d3dae4', strokeW:1.5, wPiece:['#ffffff','#e9edf2'], bPiece:['#5a5a5a','#1c1c1c'], pieceInk:'#2b3440',
   css:{'--bg':'#eef1f4','--panel':'#ffffff','--panelBorder':'#dbe1ea','--ink':'#28313b','--muted':'#8b95a3',
        '--accent':'#3b6ea5','--accentInk':'#ffffff','--headFont':"'Segoe UI',system-ui,sans-serif",'--bodyFont':"system-ui,sans-serif"} },
 B:{ // Warm Classic Tabletop
   name:'Warm Classic', page:'#e7dcc4', canvasBg:'#d8c7a0',
   field:'#f3ead3', field2:'#ece0c4', nogo:'#7a5433', home:'#c8892e', homeRing:'#9c6a21',
   save:['#c9b487'], saveInk:'#5a3d1c', goalColors:{1:'#a8433a',2:'#b9772e',3:'#c8a94a',4:'#5f7d3f',5:'#3f6d84',6:'#6d4a84'},
   stroke:'#b39a6d', strokeW:1.5, wPiece:['#fbf5e6','#e5d6b3'], bPiece:['#4a3826','#241a10'], pieceInk:'#3a2a17',
   css:{'--bg':'#e7dcc4','--panel':'#f5eede','--panelBorder':'#cdb98f','--ink':'#3a2c18','--muted':'#8a7550',
        '--accent':'#8a5a2b','--accentInk':'#fbf3e2','--headFont':"Georgia,'Iowan Old Style',serif",'--bodyFont':"Georgia,serif"} },
 C:{ // Dark Premium
   name:'Dark Premium', page:'#12151c', canvasBg:'#161a22',
   field:'#252b36', field2:'#2c333f', nogo:'#0c0e13', home:'#e0b84a', homeRing:'#8a6f22',
   save:['#1f2a3a'], saveInk:'#7fb2ff', goalColors:{1:'#ff6b6b',2:'#ffa94d',3:'#ffe066',4:'#69db7c',5:'#4dabf7',6:'#b197fc'},
   stroke:'#3a424f', strokeW:1.3, wPiece:['#f2f4f8','#cfd6e0'], bPiece:['#3a4150','#12151c'], pieceInk:'#12151c',
   css:{'--bg':'#12151c','--panel':'#1c212b','--panelBorder':'#2c333f','--ink':'#e7ebf2','--muted':'#7c8798',
        '--accent':'#4dabf7','--accentInk':'#0b0e13','--headFont':"'Segoe UI',system-ui,sans-serif",'--bodyFont':"system-ui,sans-serif"} },
 D:{ // Minimal Editorial
   name:'Minimal', page:'#faf9f7', canvasBg:'#faf9f7',
   field:'#ffffff', field2:'#f4f2ee', nogo:'#1a1a1a', home:'#c0392b', homeRing:'#8e2b20',
   save:['#c0392b'], saveInk:'#fff', goalColors:{1:'#c0392b',2:'#c0392b',3:'#c0392b',4:'#c0392b',5:'#c0392b',6:'#c0392b'},
   stroke:'#ddd8cf', strokeW:1, wPiece:['#ffffff','#efece6'], bPiece:['#2a2a2a','#0c0c0c'], pieceInk:'#111',
   accentGoal:'#c0392b',
   css:{'--bg':'#faf9f7','--panel':'#ffffff','--panelBorder':'#e7e2d9','--ink':'#1a1a1a','--muted':'#9c968b',
        '--accent':'#1a1a1a','--accentInk':'#ffffff','--headFont':"'Helvetica Neue',system-ui,sans-serif",'--bodyFont':"'Helvetica Neue',system-ui,sans-serif"} },
};

const params = new URLSearchParams(location.search);
const T = THEMES[(params.get('dir')||'A').toUpperCase()] || THEMES.A;

// apply CSS vars
for(const [k,v] of Object.entries(T.css)) document.documentElement.style.setProperty(k,v);
document.body.style.background = T.page;

// ---------- board render (exact geometry) ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const OX = cv.width/2 - BOARD.cx, OY = cv.height/2 - BOARD.cy;  // center the board in canvas
function X(x){return x+OX} function Y(y){return y+OY}
function hex(n){return '#'+n.toString(16).padStart(6,'0')}

function wedge(t){
  ctx.beginPath();
  ctx.arc(X(BOARD.cx),Y(BOARD.cy),t.outerRadius,t.startAngle,t.endAngle);
  ctx.arc(X(BOARD.cx),Y(BOARD.cy),t.innerRadius,t.endAngle,t.startAngle,true);
  ctx.closePath();
}
function tileCenter(t){
  const a=(t.startAngle+t.endAngle)/2, r=(t.innerRadius+t.outerRadius)/2;
  return [X(BOARD.cx)+r*Math.cos(a), Y(BOARD.cy)+r*Math.sin(a)];
}
function drawBoard(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle=T.canvasBg; ctx.fillRect(0,0,cv.width,cv.height);
  // soft board backing disc
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=40; ctx.shadowOffsetY=10;
  ctx.beginPath(); ctx.arc(X(BOARD.cx),Y(BOARD.cy),BOARD.outerR+22,0,7);
  ctx.fillStyle=T.field2; ctx.fill();
  ctx.restore();

  let fi=0;
  for(const t of GEOM.tiles){
    if(t.type==='home'){
      ctx.beginPath();ctx.arc(X(BOARD.cx),Y(BOARD.cy),t.outerRadius,0,7);
      ctx.fillStyle=T.home; ctx.fill();
      ctx.lineWidth=4; ctx.strokeStyle=T.homeRing; ctx.stroke();
      continue;
    }
    if(t.type==='nogo'){ wedge(t); ctx.fillStyle=T.nogo; ctx.fill();
      ctx.lineWidth=T.strokeW; ctx.strokeStyle=T.stroke; ctx.stroke(); continue; }
    if(t.type==='save'){
      wedge(t);
      const g=T.goalColors[t.number]||T.saveInk;
      ctx.fillStyle=g; ctx.fill();
      ctx.lineWidth=T.strokeW; ctx.strokeStyle=T.stroke; ctx.stroke();
      // number
      const a=(t.startAngle+t.endAngle)/2, r=(t.innerRadius+t.outerRadius)/2;
      ctx.fillStyle= (T.name==='Minimal')?'#fff':'#fff';
      ctx.font='700 26px '+ (T.css['--headFont']||'sans-serif');
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.number, X(BOARD.cx)+r*Math.cos(a), Y(BOARD.cy)+r*Math.sin(a));
      continue;
    }
    // field (subtle checker via ring+sector parity)
    wedge(t);
    ctx.fillStyle= ((t.ring+t.sector)%2? T.field2 : T.field);
    ctx.fill(); ctx.lineWidth=T.strokeW; ctx.strokeStyle=T.stroke; ctx.stroke();
  }
}

// ---------- sample pieces on board ----------
function pieceOnTile(ring,sector,cls,label,stackIdx=0,stackN=1){
  const t=GEOM.tiles.find(x=>x.ring===ring&&x.sector===sector);
  if(!t)return;
  let [cx,cy]=tileCenter(t);
  if(stackN>1){ const off=(stackIdx-(stackN-1)/2)*13; cx+=off*0.7; cy+=off*0.7; }
  const R=20;
  const col = cls==='w'? T.wPiece : T.bPiece;
  const grd=ctx.createRadialGradient(cx-R*0.3,cy-R*0.4,R*0.2,cx,cy,R);
  grd.addColorStop(0,col[0]); grd.addColorStop(1,col[1]);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=6; ctx.shadowOffsetY=3;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=grd;ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.stroke();
  if(label){ctx.fillStyle= cls==='w'?T.pieceInk:'#fff'; ctx.font='700 18px '+(T.css['--headFont']||'sans-serif');
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,cx,cy);}
}
function drawPieces(){
  // white pieces advancing
  pieceOnTile(5,1,'w','3'); pieceOnTile(4,11,'w','7'); pieceOnTile(6,12,'w','1');
  pieceOnTile(3,5,'w','5'); pieceOnTile(2,7,'w','9');
  // black pieces + a 2-stack block on a field tile
  pieceOnTile(4,3,'b','2'); pieceOnTile(5,9,'b','8'); pieceOnTile(3,10,'b','4');
  pieceOnTile(5,7,'b','6',0,2); pieceOnTile(5,7,'b','',1,2); // block
}

// ---------- HUD pieces ----------
function mkpc(cls,label){const d=document.createElement('div');d.className='pc '+cls;d.textContent=label;return d;}
function fill(id,arr){const el=document.getElementById(id);arr.forEach(([c,l])=>el.appendChild(mkpc(c,l)));}
fill('wrack',[['w','2'],['w','4'],['w','6'],['w','8'],['w','10'],['w','11']]);
fill('wsaved',[['w','1'],['w','5'],['w','12']]);
fill('brack',[['b','1'],['b','3'],['b','5'],['b','7'],['b','9'],['b','12']]);
fill('bsaved',[['b','10']]);

// dice pips
const PIPS={5:[[25,25],[75,25],[50,50],[25,75],[75,75]],3:[[25,25],[50,50],[75,75]]};
function die(id,n){const el=document.getElementById(id);PIPS[n].forEach(([x,y])=>{const p=document.createElement('div');p.className='pip';p.style.left=x+'%';p.style.top=y+'%';el.appendChild(p);});}
die('d1',5); die('d2',3);
document.getElementById('title').textContent = T.name.toUpperCase();

drawBoard(); drawPieces();
</script>
</body></html>
