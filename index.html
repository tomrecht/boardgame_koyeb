<!DOCTYPE html>
<html>
<head>
    <!-- game.js is UTF-8 (em dashes, curly quotes, arrows); without this a
         server that omits a charset makes the browser decode it as latin-1 -->
    <meta charset="utf-8">
    <!-- allow pinch-zoom so the board is easy to read/tap on small screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=6.0, user-scalable=yes, viewport-fit=cover">
    <title>Quahuru</title>
    <!-- Add to Home Screen launches without browser chrome, which is worth
         ~15% of the screen on a phone. Android reads the manifest; iOS Safari
         needs the apple-* meta tags and its own icon link. -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b5623b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quahuru">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <!-- Phaser is served from here, not a CDN. Two reasons: a packaged or
         offline app (see CLAUDE.md, "a real Android/iOS app") cannot depend on
         a third-party host, and a cross-origin script makes every exception it
         throws arrive as an opaque "Script error." with no stack. -->
    <script src="phaser.min.js"></script>
    <!-- On-device move selection. Tiny by itself: it pulls in onnxruntime, the
         model and the ported agent lazily, in the background, the first time the
         computer is asked to move (see local_agent.js / PORTING.md step 7). -->
    <script src="local_agent.js" defer></script>
    <script src="game.js" defer></script>
    <style>
        /* SAFE AREA, BOTH PLATFORMS AND BOTH DELIVERY MECHANISMS.
           Android 15 enforces edge-to-edge for anything targeting SDK 35+, and
           Android 16 removed the opt-out entirely, so the packaged app's
           WebView draws BEHIND the status and navigation bars. iOS has the
           notch and the home indicator. The insets reach the page two
           different ways -- env() on iOS and on Android WebView 140+, and
           Capacitor's own --safe-area-inset-* custom properties (its
           SystemBars inset handling) on anything older -- so take the larger
           of the two and read only these four everywhere else. */
        :root {
            --safe-t: max(env(safe-area-inset-top,    0px), var(--safe-area-inset-top,    0px));
            --safe-r: max(env(safe-area-inset-right,  0px), var(--safe-area-inset-right,  0px));
            --safe-b: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
            --safe-l: max(env(safe-area-inset-left,   0px), var(--safe-area-inset-left,   0px));
        }
        html, body {
            margin: 0;
            height: 100%;
            /* Chrome Android treats a horizontal drag from the edge as
               "back", which swallows drags aimed at the board. */
            overscroll-behavior: none;
            overflow-x: hidden;
            background: #d5dbe4;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            /* two-finger pinch zooms the page; single-finger goes to the canvas
               (so dragging a piece isn't hijacked as a browser pan) */
            touch-action: pinch-zoom;
        }
        canvas {
            display: block;
            margin: 0 auto;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            touch-action: pinch-zoom;
        }
        /* Phones draw into a buffer sized in device pixels and display it across
           the whole viewport. Phaser re-asserts its own inline canvas size on
           every resize, so this has to win -- without it a rotation leaves the
           canvas at the previous orientation's width. */
        /* Sized from JS in real pixels, not vw/vh: on mobile Chrome 100vh is the
           LARGE viewport (toolbar hidden), so with the URL bar showing the
           canvas is taller than the visible area -- the board's bottom goes off
           screen and the page shifts, leaving a grey strip at the top. */
        body.fill-screen canvas {
            width: var(--vw) !important;
            height: var(--vh) !important;
            max-width: none;
            max-height: none;
            position: fixed;
            /* Inset by the safe area rather than pinned to 0,0: the canvas
               carries every piece of furniture the game draws, so keeping it
               clear of the system bars keeps the racks, dice, HUD row and
               score clear of them too, in one move and in both orientations.
               _sizeCanvasToScreen sets all four properties. */
            top: var(--vy, 0px);
            left: var(--vx, 0px);
        }
    </style>
</head>
<body>
    <script>
        // Offline shell. Registered late (on load) so it never competes with
        // the game's own start-up, and skipped on file:// where it cannot work.
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw registration failed', e));
            });
        }
    </script>
</body>
</html>
