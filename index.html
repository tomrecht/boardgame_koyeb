<!DOCTYPE html>
<html>
<head>
    <!-- game.js is UTF-8 (em dashes, curly quotes, arrows); without this a
         server that omits a charset makes the browser decode it as latin-1 -->
    <meta charset="utf-8">
    <!-- allow pinch-zoom so the board is easy to read/tap on small screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=6.0, user-scalable=yes, viewport-fit=cover">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <script src="game.js" defer></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #d5dbe4;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            /* two-finger pinch zooms the page; single-finger goes to the canvas
               (so dragging a piece isn't hijacked as a browser pan) */
            touch-action: pinch-zoom;
        }
        canvas {
            display: block;
            margin: 0 auto;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            touch-action: pinch-zoom;
        }
        /* On a portrait phone, hint that landscape gives a much bigger board. */
        #rotateHint {
            display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
            z-index: 45; background: rgba(40,49,59,.85); color: #fff; font: 500 12px/1.3
            "Segoe UI", system-ui, sans-serif; padding: 6px 12px; border-radius: 8px; pointer-events: none;
        }
        @media (max-width: 820px) and (orientation: portrait) {
            #rotateHint { display: block; }
        }
    </style>
</head>
<body>
    <div id="rotateHint">↻ Rotate to landscape for a bigger board</div>
</body>
</html>
