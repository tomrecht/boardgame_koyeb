# Game-playing steps of a training loop, split across parallel runners.
# Driven by remote_play.py (train-features-v2), which uploads checkpoints to the
# `cloud-scratch` release, dispatches this with a JSON spec, waits, and
# concatenates the shards' outputs locally. Not meant to be started by hand.
#   spec = {mode: label|confirm|ccmatch|relabel|quizroll|quizbest|difficulty, ckpts: [asset...], n, shards, seed_base, env: {...}}
name: cloud-play
on:
  workflow_dispatch:
    inputs:
      ref:  { description: 'branch with the code', default: 'train-features-v2' }
      spec: { description: 'JSON job spec (see remote_play.py)', required: true }
permissions: { contents: read, actions: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { shards: '${{ steps.p.outputs.shards }}' }
    steps:
      - id: p
        env: { SPEC: '${{ inputs.spec }}' }
        run: python3 -c "import json,os; s=json.loads(os.environ['SPEC']); print('shards=' + json.dumps(list(range(s['shards']))))" >> "$GITHUB_OUTPUT"
  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: { shard: '${{ fromJSON(needs.plan.outputs.shards) }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/checkout@v4        # this workflow's own commit: lab scripts from main's side
        with: { path: self }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: |
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" scipy
      - name: checkpoints
        env: { SPEC: '${{ inputs.spec }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          for a in $(python3 -c "import json,os; print(' '.join(dict.fromkeys(json.loads(os.environ['SPEC'])['ckpts'])))"); do
            gh release download cloud-scratch -p "$a" -R "${{ github.repository }}"
          done
      - name: play
        env: { SPEC: '${{ inputs.spec }}', SHARD: '${{ matrix.shard }}', BOARDGAME_DEVICE: cpu, PYTHONHASHSEED: '0' }
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          s = json.loads(os.environ['SPEC']); k = int(os.environ['SHARD'])
          per = -(-s['n'] // s['shards']); n = min(per, s['n'] - k * per)
          if n <= 0: sys.exit(0)
          env = dict(os.environ, **{a: str(b) for a, b in s['env'].items()},
                     SEED_BASE=str(s['seed_base'] + k * per), N_WORKERS=str(os.cpu_count()))
          c = s['ckpts']
          if s['mode'] == 'label':
              cmd = ['close_call.py', 'label', c[0], env['T'], env['K'], str(n), 'shard.out']
          elif s['mode'] == 'confirm':
              cmd = ['confirm_match.py', c[0], c[1], str(n), 'shard.out']
          elif s['mode'] == 'ccmatch':
              cmd = ['close_call.py', 'match', c[0], env['T'], env['K'], str(n), 'shard.out']
          elif s['mode'] == 'relabel':      # SEED_BASE = first decision index of this shard
              cmd = ['rollout_label.py', 'run', c[0], c[1], 'shard.out', str(n)]
          elif s['mode'] == 'quizbest':
              cmd = ['quiz_best.py', 'run', c[0], c[1], 'shard.out', str(n)]
          elif s['mode'] == 'difficulty':   # SEED_BASE = first task index; LEVELS in env
              cmd = ['difficulty_fine.py', 'run', c[0], 'shard.out', str(n)]
          elif s['mode'] == 'quizroll':     # SEED_BASE = first task index of this shard
              cmd = ['quiz_playout.py', 'run', c[0], c[1], 'shard.out', str(n)]
          elif s['mode'] == 'matchsp':      # match awareness: self-play values + final margins
              cmd = ['self/lab/match/selfplay_values.py', c[0], 'shard.out', str(n), env['SEED_BASE']]
          elif s['mode'] == 'matchplay':    # whole matches in node: match-aware (A) vs plain (B)
              cmd = ['node', 'self/lab/match/match_play.js', 'self/' + env.get('MATCH_MODEL', 'match_model_sum7.json'),
                     'shard.out', str(n), env['SEED_BASE'], env.get('MATCH_MODE', 'games'),
                     env.get('MATCH_TARGET', '6'), env.get('GOAL_LAYOUT', 'sum7')]
          else:
              sys.exit('unknown mode ' + s['mode'])
          print('shard', k, 'seeds', env['SEED_BASE'], 'n', n, ' '.join(cmd), flush=True)
          if cmd[0] == 'node':              # single-threaded: one process per core, sub-ranges
              subprocess.check_call(['npm', 'i', '--prefix', '/tmp/ort', 'onnxruntime-node@1.23.2'], stdout=subprocess.DEVNULL)
              env['ORT_NODE'] = '/tmp/ort'
              P = os.cpu_count() or 4
              sub = -(-n // P); procs = []
              for j in range(P):
                  m = min(sub, n - j * sub)
                  if m <= 0: break
                  c2 = list(cmd); c2[3] = f'part{j}.out'; c2[4] = str(m); c2[5] = str(s['seed_base'] + k * per + j * sub)
                  procs.append(subprocess.Popen(c2, env=env))
              rc = max(p.wait() for p in procs)
              with open('shard.out', 'w') as f:
                  for j in range(len(procs)):
                      if os.path.exists(f'part{j}.out'): f.write(open(f'part{j}.out').read())
              sys.exit(rc)
          sys.exit(subprocess.call([sys.executable, '-u', *cmd], env=env))
          PY
      - name: print output
        if: always()
        run: if [ -f shard.out ] && [ "$(stat -c%s shard.out)" -lt 2000000 ]; then echo '=====SHARD-OUT-BEGIN====='; (zcat -f shard.out 2>/dev/null || cat shard.out); echo '=====SHARD-OUT-END====='; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'shard-${{ matrix.shard }}', path: shard.out, if-no-files-found: ignore, retention-days: 7 }
  merge:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/checkout@v4
        with: { path: self }
      - uses: actions/download-artifact@v4
        with: { pattern: 'shard-*', path: shards }
      - name: summary
        env: { SPEC: '${{ inputs.spec }}' }
        run: |
          find shards -name shard.out | sort | xargs -r cat > merged.out || true
          echo "records: $(zcat -f merged.out 2>/dev/null | wc -l)"
          MODE=$(python3 -c "import json,os; print(json.loads(os.environ['SPEC'])['mode'])")
          if [ "$MODE" = matchplay ]; then python3 self/lab/match/summarize.py merged.out; fi
          if [ "$MODE" = difficulty ]; then
            LEVELS=$(python3 -c "import json,os; print(json.loads(os.environ['SPEC'])['env'].get('LEVELS',''))") python3 difficulty_fine.py analyze merged.out
          fi
      - name: merged output as a release asset (readable where artifacts are not)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -s merged.out ] || exit 0
          cp merged.out "run-${{ github.run_id }}.out"
          gh release upload cloud-scratch "run-${{ github.run_id }}.out" --clobber -R "${{ github.repository }}"
          echo "asset: https://github.com/${{ github.repository }}/releases/download/cloud-scratch/run-${{ github.run_id }}.out"
